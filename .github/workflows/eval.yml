name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          source .venv/bin/activate
          pip install -U google-adk deepeval pytest pytest-asyncio pytest-repeat pytest-rerunfailures litellm

      - name: Run CI Eval Gate (Deterministic offline suite + Calibration)
        run: |
          source .venv/bin/activate
          MODEL_NAME=mock python -m pytest tests/evals/ -v --durations=10

      - name: Run DeepEval CLI suite (if API keys present)
        if: env.GEMINI_API_KEY != '' || env.OPENAI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source .venv/bin/activate
          deepeval test run tests/evals/
